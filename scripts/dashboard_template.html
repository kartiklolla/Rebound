<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebound · Recovery console</title>
<style>
:root{
  --bg:#0b0f19; --panel:#121826; --panel2:#171f30; --line:#222c40; --line2:#1a2333;
  --ink:#eef2f8; --body:#a8b3c7; --mute:#6e7a91;
  --blue:#4c8dff; --blue-dim:rgba(76,141,255,.14);
  --ok:#2ecc71; --ok-dim:rgba(46,204,113,.13);
  --warn:#f5b13d; --warn-dim:rgba(245,177,61,.13);
  --bad:#ff6b5e; --bad-dim:rgba(255,107,94,.13);
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",
    Arial,"Noto Sans",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num,.mono{font-family:"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",
  monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
.hide{display:none!important}
button{font-family:inherit}

/* ---------- shell ---------- */
header{border-bottom:1px solid var(--line);background:var(--panel);
  position:sticky;top:0;z-index:30}
.bar{max-width:1240px;margin:0 auto;padding:0 22px;height:56px;
  display:flex;align-items:center;gap:28px}
.logo{display:flex;align-items:center;gap:9px;font-weight:650;font-size:16px}
.logo i{width:24px;height:24px;border-radius:6px;background:var(--blue);
  display:grid;place-items:center;font-style:normal;font-size:13px;
  font-weight:800;color:#07101f}
nav{display:flex;gap:3px}
nav button{all:unset;padding:7px 14px;border-radius:7px;cursor:pointer;
  color:var(--body);font-size:13.5px;font-weight:520}
nav button:hover{color:var(--ink);background:var(--panel2)}
nav button[aria-current]{background:var(--blue-dim);color:var(--blue)}
.badge{margin-left:auto;color:var(--mute);font-size:12px}
main{max-width:1240px;margin:0 auto;padding:22px}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px}
.tile .k{color:var(--mute);font-size:11px;text-transform:uppercase;
  letter-spacing:.07em;font-weight:600}
.tile .v{font-size:26px;font-weight:650;margin-top:5px;letter-spacing:-.02em}
.tile .d{color:var(--mute);font-size:12px;margin-top:2px}
.tile.up .v{color:var(--ok)} .tile.down .v{color:var(--bad)}

/* ---------- run ---------- */
.runbar{display:flex;align-items:center;gap:14px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;
  margin-bottom:14px}
.play{all:unset;display:flex;align-items:center;gap:9px;cursor:pointer;
  background:var(--blue);color:#07101f;font-weight:650;font-size:13.5px;
  padding:9px 18px;border-radius:8px}
.play:hover{filter:brightness(1.08)}
.play.stop{background:var(--panel2);color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--line)}
.speeds{display:flex;gap:2px;background:var(--panel2);padding:3px;border-radius:7px}
.speeds button{all:unset;padding:5px 11px;border-radius:5px;cursor:pointer;
  color:var(--mute);font-size:12.5px}
.speeds button[aria-pressed="true"]{background:var(--blue-dim);color:var(--blue)}
.progress{flex:1;height:5px;background:var(--panel2);border-radius:99px;
  overflow:hidden;min-width:90px}
.progress i{display:block;height:100%;background:var(--blue);width:0;
  transition:width .12s linear}
.runbar .pos{color:var(--mute);font-size:12.5px;min-width:104px;text-align:right}

.feed{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  height:420px;overflow:hidden;position:relative}
.feed .rows{position:absolute;inset:0;overflow-y:auto;padding:4px 0}
.ev{display:flex;align-items:center;gap:12px;padding:9px 16px;
  border-bottom:1px solid var(--line2);font-size:13px;
  animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.ev .ep{color:var(--mute);width:104px;flex:none}
.ev .ac{width:190px;flex:none;font-weight:520}
.ev .rs{color:var(--body);flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ev .mo{width:96px;text-align:right;flex:none}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.d-ok{background:var(--ok)} .d-bad{background:var(--bad)} .d-mid{background:var(--mute)}
.empty{position:absolute;inset:0;display:grid;place-items:center;
  color:var(--mute);font-size:13.5px;text-align:center;padding:20px}

/* ---------- list + detail ---------- */
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:1000px){.split{grid-template-columns:1fr}}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden}
.lrow{all:unset;display:flex;align-items:center;gap:12px;width:100%;
  padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--line2);
  box-sizing:border-box}
.lrow:hover{background:var(--panel2)}
.lrow[aria-selected="true"]{background:var(--blue-dim);
  box-shadow:inset 2px 0 0 var(--blue)}
.lrow .who{width:112px;flex:none;font-weight:550}
.lrow .what{flex:1;color:var(--body);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.lrow .ev{padding:0;border:0;width:auto}

.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;
  font-size:11.5px;font-weight:620;white-space:nowrap}
.p-done{background:var(--ok-dim);color:var(--ok)}
.p-scheduled{background:var(--warn-dim);color:var(--warn)}
.p-declined{background:var(--bad-dim);color:var(--bad)}
.p-honoured{background:var(--blue-dim);color:var(--blue)}
.p-reg{background:var(--bad-dim);color:var(--bad)}
.p-pol{background:rgba(168,179,199,.13);color:var(--body)}

.detail{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:18px;position:sticky;top:78px}
.dhead{display:flex;align-items:center;gap:11px;margin-bottom:4px}
.dhead h2{font-size:16px}
.dsub{color:var(--mute);font-size:12.5px;margin-bottom:16px}

/* ---------- pipeline ---------- */
.stage{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line2);
  opacity:0;transform:translateX(-6px);animation:slide .22s ease-out forwards}
@keyframes slide{to{opacity:1;transform:none}}
.stage .n{width:22px;height:22px;border-radius:50%;flex:none;display:grid;
  place-items:center;font-size:11px;font-weight:700;background:var(--panel2);
  color:var(--mute)}
.stage.pass .n{background:var(--ok-dim);color:var(--ok)}
.stage.fail .n{background:var(--bad-dim);color:var(--bad)}
.stage.hold .n{background:var(--warn-dim);color:var(--warn)}
.stage .t{flex:1;min-width:0}
.stage .h{font-weight:560;font-size:13.5px;display:flex;gap:9px;
  align-items:center;justify-content:space-between}
.stage .b{color:var(--mute);font-size:12.5px;margin-top:2px}
.stage .val{font-size:13px}

.kv{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-size:13px;
  margin-top:10px}
.kv dt{color:var(--body)} .kv dd{margin:0;text-align:right}
.kv .tot{border-top:1px solid var(--line);padding-top:7px;margin-top:3px;
  font-weight:650}
.pos{color:var(--ok)} .neg{color:var(--bad)}

table{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:9px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line2)}
th{color:var(--mute);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.06em;font-weight:650}
tr:last-child td{border-bottom:none}
tr.bind{background:var(--blue-dim)}
.tw{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:9px}
.tw table{margin:0}
.tw th{background:var(--panel2)}

.sms{background:#0d1420;border:1px solid var(--line);border-radius:9px;
  padding:12px 14px;margin-top:9px}
.sms .t{font-size:13px;line-height:1.5}
.sms .m{color:var(--mute);font-size:11px;margin-top:7px}

h3.sec{font-size:11px;color:var(--mute);text-transform:uppercase;
  letter-spacing:.07em;margin:20px 0 8px;font-weight:650}
.note{color:var(--mute);font-size:12px;margin:9px 0 0}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.split2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:16px}
.bars{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:2px 0 9px}
.leg{display:flex;gap:15px;flex-wrap:wrap;font-size:12.5px;color:var(--body)}
.leg b{color:var(--ink)}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
footer{max-width:1240px;margin:0 auto;padding:26px 22px 50px;color:var(--mute);
  font-size:12px}
</style>
</head>
<body>

<header><div class="bar">
  <div class="logo"><i>R</i> Rebound</div>
  <nav>
    <button aria-current data-v="run">Live run</button>
    <button data-v="requests">Requests</button>
    <button data-v="batch">Batch</button>
  </nav>
  <span class="badge" id="badge"></span>
</div></header>

<main>
  <section id="run">
    <div class="tiles" id="runTiles"></div>
    <div style="height:14px"></div>
    <div class="runbar">
      <button class="play" id="play">▶ Run batch</button>
      <div class="speeds" id="speeds">
        <button data-s="60" aria-pressed="true">1×</button>
        <button data-s="20">4×</button>
        <button data-s="6">16×</button>
      </div>
      <div class="progress"><i id="bar"></i></div>
      <span class="pos" id="pos"></span>
    </div>
    <div class="feed"><div class="rows" id="feed"></div>
      <div class="empty" id="feedEmpty">Press <b style="color:var(--blue)">Run
        batch</b> to replay the recorded rollout, action by action.</div></div>
    <p class="note">Replay of a recorded run — the same audit trail the batch
      table is built from. Nothing is recomputed here.</p>
  </section>

  <section id="requests" class="hide">
    <div class="split">
      <div class="list" id="reqList"></div>
      <div class="detail" id="reqDetail"></div>
    </div>
  </section>

  <section id="batch" class="hide">
    <div class="tiles" id="batchTiles"></div>
    <div style="height:16px"></div>
    <div class="tw"><table id="polTable"></table></div>
    <p class="note" id="polNote"></p>
    <div style="height:16px"></div>
    <div class="split2">
      <div class="card">
        <h3 class="sec" style="margin-top:0">Request outcomes</h3>
        <div id="outcomes"></div>
      </div>
      <div class="card">
        <h3 class="sec" style="margin-top:0">Unrecovered, by reason</h3>
        <div class="tw" style="margin-top:0"><table id="excTable"></table></div>
      </div>
    </div>
    <h3 class="sec">How an action is graded</h3>
    <div class="card">
      <div class="mono" style="background:#0d1420;border:1px solid var(--line);
        border-radius:8px;padding:12px;font-size:12.5px;overflow-x:auto"
        id="formula"></div>
      <div class="tw"><table id="termTable"></table></div>
    </div>
  </section>
</main>

<footer id="foot"></footer>

<script>
const D = /*__DATA__*/null;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>(n<0?'−₹':'₹')+Math.abs(Math.round(n)).toLocaleString('en-IN');
const inr2=n=>(n<0?'−₹':'₹')+Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:2});
const pct=n=>(n*100).toFixed(1)+'%';

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.removeAttribute('aria-current'));
  b.setAttribute('aria-current','');
  ['run','requests','batch'].forEach(v=>$('#'+v).classList.toggle('hide',v!==b.dataset.v));
  window.scrollTo(0,0);
});

/* ================= live run ================= */
const AUDIT=D.policies.audit;
let i=0,timer=null,delay=60,acc={rec:0,spent:0,eps:new Set(),won:new Set(),lost:0};

function tiles(el,items){el.innerHTML=items.map(([k,v,d,c])=>
  `<div class="tile ${c||''}"><div class="k">${k}</div>
   <div class="v num">${v}</div><div class="d">${esc(d)}</div></div>`).join('')}

function paintRun(){
  const net=acc.rec-acc.spent;
  tiles($('#runTiles'),[
    ['Episodes',acc.eps.size.toLocaleString('en-IN'),'of '+D.episodes.toLocaleString('en-IN')],
    ['Recovered',inr(acc.rec),acc.won.size+' collected'],
    ['Spent',inr(acc.spent),'fees and messages'],
    ['Revocations',acc.lost,'mandates lost'],
    ['Net',inr(net),'recovered less spent',net>=0?'up':'down'],
  ]);
  $('#bar').style.width=(i/AUDIT.length*100)+'%';
  $('#pos').textContent=i+' / '+AUDIT.length+' actions';
}

function step(){
  if(i>=AUDIT.length){stop();return}
  const e=AUDIT[i++];
  acc.eps.add(e.episode); acc.spent+=e.cost; acc.rec+=e.recovered;
  if(e.succeeded)acc.won.add(e.episode); if(e.revoked)acc.lost++;
  const cls=e.succeeded?'d-ok':e.revoked?'d-bad':'d-mid';
  const row=document.createElement('div');
  row.className='ev';
  row.innerHTML=`<span class="dot ${cls}"></span>
    <span class="ep mono">${esc(e.episode.slice(3,11))}</span>
    <span class="ac mono">${esc(e.action)}</span>
    <span class="rs">${esc(e.detail)}</span>
    <span class="mo num ${e.recovered?'pos':''}">${e.recovered?inr(e.recovered):
      '−'+inr2(e.cost).replace('₹','₹')}</span>`;
  const feed=$('#feed');
  feed.prepend(row);
  while(feed.childElementCount>90)feed.lastElementChild.remove();
  paintRun();
}
function play(){$('#feedEmpty').style.display='none';
  $('#play').textContent='❚❚ Pause';$('#play').classList.add('stop');
  timer=setInterval(step,delay)}
function stop(){clearInterval(timer);timer=null;
  $('#play').textContent=i>=AUDIT.length?'↻ Replay':'▶ Resume';
  $('#play').classList.remove('stop')}
$('#play').onclick=()=>{
  if(timer)return stop();
  if(i>=AUDIT.length){i=0;acc={rec:0,spent:0,eps:new Set(),won:new Set(),lost:0};
    $('#feed').innerHTML=''}
  play();
};
$('#speeds').onclick=e=>{
  const b=e.target.closest('button'); if(!b)return;
  delay=+b.dataset.s;
  [...$('#speeds').children].forEach(x=>x.setAttribute('aria-pressed',x===b));
  if(timer){clearInterval(timer);timer=setInterval(step,delay)}
};
paintRun();

/* ================= requests ================= */
const REQ=[];
D.accounts.forEach(a=>a.answers.forEach(x=>REQ.push({a,x})));
let sel=0;

function paintList(){
  $('#reqList').innerHTML=REQ.map((r,n)=>`
    <button class="lrow" aria-selected="${n===sel}" data-n="${n}">
      <span class="who">${esc(r.a.name)}</span>
      <span class="what">${esc(r.x.label)}</span>
      <span class="pill p-${r.x.outcome}">${r.x.outcome}</span>
    </button>`).join('');
  $('#reqList').querySelectorAll('.lrow').forEach(b=>
    b.onclick=()=>{sel=+b.dataset.n;paintList();paintDetail()});
}

function stageRow(n,cls,head,val,body,d){
  return `<div class="stage ${cls}" style="animation-delay:${d}ms">
    <span class="n">${n}</span><span class="t">
    <span class="h"><span>${head}</span><span class="val num">${val}</span></span>
    <span class="b">${body}</span></span></div>`;
}

function paintDetail(){
  const {a,x}=REQ[sel];
  const g=x.grading, bind=x.rulings.find(r=>r.binding&&r.rule!=='—');
  let s=`<div class="dhead"><h2>${esc(x.label)}</h2>
      <span class="pill p-${x.outcome}">${x.outcome}</span></div>
    <div class="dsub">${esc(a.name)} · ${esc(a.plan)} · ${esc(a.amount)}
      · ${esc(a.rail.replace(/_/g,' '))}</div>`;

  s+=stageRow(1, x.action?(x.rulings.length||x.outcome!=='declined'?'pass':'fail')
      :'pass', 'Classify',
    esc(a.disposition), x.action?esc(x.action):'no action — not a request', 0);

  s+=stageRow(2, g?'pass':'', 'Price',
    g?inr2(g.expected_value):'—',
    g?`p(recover) ${g.p_recover.toFixed(3)} · p(revoke) ${g.p_revoke.toFixed(3)}`
     :'not priced', 110);

  s+=stageRow(3,
    !x.adjudicated?'':x.outcome==='declined'?'fail':x.outcome==='scheduled'?'hold':'pass',
    'Adjudicate',
    x.adjudicated?esc(x.outcome):'skipped',
    x.adjudicated?(bind?esc(bind.rule):'no rule objected')
      :'not adjudicated — not ours to refuse', 220);

  s+=stageRow(4, x.outcome==='declined'?'fail':'pass', 'Act',
    esc(x.happens_at||(x.outcome==='declined'?'—':'now')),
    esc(x.headline), 330);

  if(x.rulings.length){
    s+=`<h3 class="sec">Rules consulted</h3><div class="tw"><table>
      <tr><th>Rule</th><th>Basis</th><th>Verdict</th></tr>`+
      x.rulings.map(r=>`<tr class="${r.binding?'bind':''}">
        <td class="mono">${esc(r.rule)}</td>
        <td>${r.basis==='regulatory'?'<span class="pill p-reg">reg</span>':
          r.basis==='policy'?'<span class="pill p-pol">policy</span>':'—'}</td>
        <td>${esc(r.verdict)}</td></tr>`).join('')+`</table></div>`;
    if(bind)s+=`<p class="note">${esc(bind.reason)}</p>`;
  }

  if(g){
    s+=`<h3 class="sec">Expected value</h3><dl class="kv">
      <dt>Recovery worth</dt><dd class="num">${inr2(g.recovery_value)}</dd>
      <dt>× p(recover) ${g.p_recover.toFixed(3)}</dt>
        <dd class="num pos">+${inr2(g.recovery_value*g.p_recover)}</dd>
      <dt>× p(revoke) ${g.p_revoke.toFixed(3)}</dt>
        <dd class="num neg">−${inr2(g.revocation_charge*g.p_revoke)}</dd>
      <dt>Contact fatigue</dt><dd class="num neg">−${inr2(g.fatigue)}</dd>
      <dt>Cost</dt><dd class="num neg">−${inr2(g.cost)}</dd>
      <dt class="tot">Expected value</dt>
      <dd class="tot num ${g.expected_value>=0?'pos':'neg'}">${inr2(g.expected_value)}</dd>
    </dl>`;
    if(!g.worth_unprompted&&x.outcome!=='declined')
      s+=`<p class="note">Negative, and done anyway — the customer asked and the
        gate permits it.</p>`;
  }

  if(a.messages.length&&x.outcome!=='declined'&&x.action){
    s+=`<h3 class="sec">Message sent</h3>`+a.messages.map(m=>`
      <div class="sms"><div class="t">${esc(m.body)}</div>
      <div class="m mono">${esc(m.language)} · ${m.segments} seg ·
        ${m.units} units · ${esc(m.encoding)}</div></div>`).join('');
  }
  $('#reqDetail').innerHTML=s;
}
paintList(); paintDetail();

/* ================= batch ================= */
const P=D.policies, ours=P.rows.find(r=>r.policy==='rebound_sequencer'),
      lad=P.rows.find(r=>r.policy==='fixed_ladder');
tiles($('#batchTiles'),[
  ['Episodes',D.episodes.toLocaleString('en-IN'),'this batch'],
  ['Recovery',pct(ours.recovery),'ladder '+pct(lad.recovery)],
  ['Revocation',pct(ours.revocation),'ladder '+pct(lad.revocation)],
  ['Contacts / ep',ours.contacts.toFixed(2),'ladder 0.00'],
  ['Net ₹/1000',inr(ours.net),'vs ladder '+(ours.gap>=0?'+':'')+inr(ours.gap),
    ours.gap>=0?'up':'down'],
]);
$('#polTable').innerHTML=`<tr><th>Policy</th><th style="text-align:right">Recovery</th>
  <th style="text-align:right">Revoked</th><th style="text-align:right">Contacts</th>
  <th style="text-align:right">Recovered</th><th style="text-align:right">Spent</th>
  <th style="text-align:right">Net ₹/1000</th><th style="text-align:right">vs ladder</th></tr>`+
  P.rows.map(r=>`<tr${r.policy==='rebound_sequencer'?' class="bind"':''}>
    <td class="mono">${esc(r.policy)}</td>
    <td class="num" style="text-align:right">${pct(r.recovery)}</td>
    <td class="num" style="text-align:right">${pct(r.revocation)}</td>
    <td class="num" style="text-align:right">${r.contacts.toFixed(2)}</td>
    <td class="num" style="text-align:right">${inr(r.recovered)}</td>
    <td class="num" style="text-align:right">${inr(r.spent)}</td>
    <td class="num ${r.net>=0?'pos':'neg'}" style="text-align:right">${inr(r.net)}</td>
    <td class="num ${r.gap>=0?'pos':'neg'}" style="text-align:right">${
      r.policy==='fixed_ladder'?'—':(r.gap>=0?'+':'')+inr(r.gap)}</td></tr>`).join('');
const lead=P.rows[0].policy;
$('#polNote').innerHTML=(lead!=='rebound_sequencer'
  ?`<b style="color:var(--warn)">${esc(lead)} leads this batch.</b> `:'')+
  `One seed, reduced scale. Reported claim: five held-out seeds, mean
   <b>+40,916</b> ₹/1000, not significant (p≈0.07), negative on one.`;

const C={done:'#2ecc71',scheduled:'#f5b13d',honoured:'#4c8dff',declined:'#ff6b5e'};
const o=D.requests.outcomes, keys=Object.keys(C).filter(k=>o[k]);
$('#outcomes').innerHTML=`<div class="bars">`+keys.map(k=>
  `<i style="flex:${o[k]};background:${C[k]}"></i>`).join('')+`</div>
  <div class="leg">`+keys.map(k=>
  `<span><span class="sw" style="background:${C[k]}"></span>${k} <b>${o[k]}</b></span>`
  ).join('')+`</div>
  <p class="note">Declined = the taxonomy or a regulator refused. Honoured = never
   adjudicated.</p>`;

$('#excTable').innerHTML=`<tr><th>Reason</th><th style="text-align:right">n</th></tr>`+
  P.exceptions.map(e=>`<tr><td>${esc(e.reason)}</td>
    <td class="num" style="text-align:right">${e.count}</td></tr>`).join('');
$('#formula').textContent=D.grading.formula;
$('#termTable').innerHTML=`<tr><th>Term</th><th>Meaning</th></tr>`+
  D.grading.terms.map(([k,v])=>`<tr><td class="mono">${esc(k)}</td>
    <td>${esc(v)}</td></tr>`).join('');

$('#badge').textContent=D.episodes.toLocaleString('en-IN')+' episodes · built '+D.generated_at;
$('#foot').innerHTML='Every figure computed in Python by the shipped modules and '+
  'embedded as data — the browser replays, it never recomputes. Simulated data.';
</script>
</body>
</html>

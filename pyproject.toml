[project]
name = "rebound"
version = "0.1.0"
description = "Recovery orchestrator for failed recurring debits on Indian payment rails (UPI Autopay, eNACH, card-on-file)."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# The comms layer runs without this. TemplateDrafter needs no network and the
# whole test suite exercises the desk against a stub client, so a reviewer can
# run everything — including the red-team evaluation — with no API key and no
# account. Only scripts/evaluate_comms.py --model needs it.
llm = [
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rebound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

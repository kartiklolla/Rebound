[project]
name = "rebound"
version = "0.1.0"
description = "Recovery orchestrator for failed recurring debits on Indian payment rails (UPI Autopay, eNACH, card-on-file)."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rebound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
